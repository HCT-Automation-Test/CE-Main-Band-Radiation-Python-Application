[project]
name = "app"
version = "0.1.0"
description = "CE NR Radiated 측정 자동화 SW (PySide6)"
requires-python = ">=3.11"
dependencies = [
    "pyside6",
    "openpyxl",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-qt",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
